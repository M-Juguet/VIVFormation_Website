<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Rayons</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.r{display:flex;gap:14px}.c{flex:1;text-align:center}.c i{display:block;height:72px;background:var(--surface-brand);border:1px solid var(--border)}.c b{display:block;font:var(--text-label);margin-top:8px}.c em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}</style>
</head><body>
<div class="r">
<div class="c"><i style="border-radius:var(--radius-sm)"></i><b>sm 6px</b><em>Champ</em></div>
<div class="c"><i style="border-radius:var(--radius-md)"></i><b>md 10px</b><em>Bouton, encart</em></div>
<div class="c"><i style="border-radius:var(--radius-lg)"></i><b>lg 18px</b><em>Carte, panneau</em></div>
<div class="c"><i style="border-radius:var(--radius-xl)"></i><b>xl 28px</b><em>Couverture</em></div>
<div class="c"><i style="border-radius:var(--radius-pill)"></i><b>pill</b><em>Badge, pastille</em></div>
</div></body></html>
