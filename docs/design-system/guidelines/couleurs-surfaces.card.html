<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.sw{display:flex;gap:12px}.s{flex:1}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-label);margin-top:8px}.s em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}</style>
</head><body>
<div class="sw">
<div class="s"><i style="background:var(--surface)"></i><b>--surface</b><em>#ffffff</em><em>Page</em></div>
<div class="s"><i style="background:var(--surface-sunken)"></i><b>--surface-sunken</b><em>#faf6f7</em><em>Bandeau, colonne</em></div>
<div class="s"><i style="background:var(--surface-raised)"></i><b>--surface-raised</b><em>#ffffff</em><em>Carte</em></div>
<div class="s"><i style="background:var(--surface-brand)"></i><b>--surface-brand</b><em>#fbf1f5</em><em>Encart de marque</em></div>
<div class="s"><i style="background:var(--surface-accent)"></i><b>--surface-accent</b><em>#fdf6e8</em><em>Objectifs</em></div>
<div class="s"><i style="background:var(--surface-code)"></i><b>--surface-code</b><em>#f4f0f2</em><em>Bloc technique</em></div>
</div></body></html>
