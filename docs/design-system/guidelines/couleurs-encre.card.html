<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Encres</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.l{display:flex;flex-direction:column;gap:10px}.l p{margin:0}.l span{font:var(--text-caption);color:var(--ink-muted)}</style>
</head><body>
<div class="l">
<p class="body-lg" style="color:var(--ink)">--ink · Texte courant et titres <span>#1c161b — 13,9:1</span></p>
<p class="body" style="color:var(--ink-muted)">--ink-muted · Chapô, légende, métadonnées de session <span>#5a4e56 — 7,3:1</span></p>
<p class="body-sm" style="color:var(--ink-subtle)">--ink-subtle · Mentions légales, aide de champ, horodatage <span>#736570 — 5,1:1</span></p>
<p class="body" style="background:var(--brand-gold);color:var(--ink-on-pastel);padding:6px 12px;border-radius:var(--radius-md)">--ink-on-pastel · sur les pastels de marque, dans les deux thèmes</p>
<p class="body" style="background:var(--ink);color:var(--ink-inverse);padding:6px 12px;border-radius:var(--radius-md)">--ink-inverse · sur un aplat ink</p>
</div></body></html>
