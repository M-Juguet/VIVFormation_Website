<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Filets et focus</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.r{display:flex;gap:16px;align-items:center}.box{flex:1;padding:16px;border-radius:var(--radius-lg);border:1px solid var(--border);font:var(--text-body-sm);color:var(--ink-muted)}.inp{flex:1;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font:var(--text-body);color:var(--ink-subtle)}.foc{flex:1;padding:8px 12px;border:1px solid var(--action);border-radius:var(--radius-sm);outline:2px solid var(--focus);outline-offset:2px;font:var(--text-body);color:var(--ink)}</style>
</head><body>
<div class="r">
<span class="box">--border · contour de carte, ligne de tableau</span>
<span class="inp">--border-strong · champ de saisie</span>
<span class="foc">--focus · anneau clavier</span>
</div></body></html>
