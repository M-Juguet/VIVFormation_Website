<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Ombres</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.r{display:flex;gap:20px;padding:8px}.c{flex:1;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}.c b{display:block;font:var(--text-label)}.c em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal;margin-top:4px}</style>
</head><body>
<div class="r">
<div class="c" style="box-shadow:var(--shadow-sm)"><b>shadow-sm</b><em>Carte au repos</em></div>
<div class="c" style="box-shadow:var(--shadow-md)"><b>shadow-md</b><em>Carte au survol, en-tête collant</em></div>
<div class="c" style="box-shadow:var(--shadow-lg)"><b>shadow-lg</b><em>Modale, menu déroulant</em></div>
</div></body></html>
