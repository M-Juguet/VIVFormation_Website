<!-- @dsCard group="Colors" viewport="700x200" name="Pastels de marque" subtitle="Les deux arrêts du logo et leur milieu dérivé — aplats seulement, jamais de texte" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Pastels de marque</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.sw{display:flex;gap:12px}.s{flex:1}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-label);margin-top:8px}.s em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}</style>
</head><body>
<div class="sw">
<div class="s"><i style="background:var(--brand-rose)"></i><b>--brand-rose</b><em>#daa5bc</em><em>Arrêt 1 du logo</em></div>
<div class="s"><i style="background:var(--brand-peach)"></i><b>--brand-peach</b><em>#edc6a6</em><em>Milieu dérivé</em></div>
<div class="s"><i style="background:var(--brand-gold)"></i><b>--brand-gold</b><em>#fbde96</em><em>Arrêt 2 du logo</em></div>
<div class="s"><i style="background:var(--gradient-brand)"></i><b>--gradient-brand</b><em>90deg, rose 15% → or 76%</em><em>Un seul élément par écran</em></div>
</div></body></html>
