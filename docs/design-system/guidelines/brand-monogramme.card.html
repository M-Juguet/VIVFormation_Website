<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Monogramme et submark</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.r{display:flex;gap:20px;align-items:center}.c{border-radius:var(--radius-lg);padding:20px;display:flex;align-items:center;justify-content:center}.t{width:64px;height:64px;border-radius:7.68px;display:flex;align-items:center;justify-content:center}.t img{height:21.76px;width:auto;display:block}.lbl{font:var(--text-caption);color:var(--ink-muted);margin:10px 0 0}</style>
</head><body>
<div class="r">
<div class="c" style="background:var(--surface);border:1px solid var(--border)"><img src="../assets/logos/viv-monogramme-couleur.svg" alt="VIV Formation" style="height:48px;padding:14px"></div>
<div class="t" style="background:var(--gradient-brand)"><img src="../assets/logos/viv-submark-noir.svg" alt="VIV Formation"></div>
<div class="t" style="background:var(--ink)"><img src="../assets/logos/viv-submark-blanc.svg" alt="VIV Formation"></div>
<div class="t" style="background:var(--ink-muted)"><img src="../assets/logos/viv-submark-blanc.svg" alt="VIV Formation"></div>
<div class="t" style="background:var(--surface);box-shadow:inset 0 0 0 2px var(--border-strong)"><img src="../assets/logos/viv-submark-noir.svg" alt="VIV Formation"></div>
</div>
<p class="lbl">Pastille : rayon 0,12 × le côté, marque 0,34 × le côté, centrée. Côté minimal 24 px ; en dessous, exportez un favicon 16 px. Le submark n'existe qu'en noir et blanc.</p>
</body></html>
