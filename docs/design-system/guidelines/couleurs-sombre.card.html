<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Thème sombre</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.sw{display:flex;gap:12px}.s{flex:1}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-label);margin-top:8px}.s em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}body{background:var(--surface)}</style>
</head><body>
<div data-theme="sombre" style="background:var(--surface);padding:16px;border-radius:var(--radius-lg)">
<div class="sw">
<div class="s"><i style="background:var(--surface-raised)"></i><b>--surface-raised</b><em>#221b21</em><em>Carte</em></div>
<div class="s"><i style="background:var(--ink)"></i><b>--ink</b><em>#f7f2f4</em><em>Texte courant</em></div>
<div class="s"><i style="background:var(--action)"></i><b>--action</b><em>#f0b8ce</em><em>Lien, bouton primaire</em></div>
<div class="s"><i style="background:var(--brand-gold)"></i><b>--brand-gold</b><em>#fbde96</em><em>Inchangé</em></div>
<div class="s"><i style="background:var(--border)"></i><b>--border</b><em>#332a31</em><em>Filet</em></div>
</div>
<p class="body-sm" style="color:var(--ink-muted);margin:16px 0 0">En sombre, comptez d'abord sur surface-raised et border : l'ombre s'y voit peu.</p>
</div></body></html>
