<!-- @dsCard group="Colors" viewport="700x220" name="Statuts" subtitle="Jamais la couleur seule : chaque statut porte son mot" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Statuts</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.sw{display:flex;gap:12px}.s{flex:1}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-label);margin-top:8px}.s em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}.pills{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.p{font:var(--text-label);padding:4px 12px;border-radius:var(--radius-pill)}</style>
</head><body>
<div class="sw">
<div class="s"><i style="background:var(--success)"></i><b>--success</b><em>#1f7a5c</em><em>Session confirmée</em></div>
<div class="s"><i style="background:var(--warning)"></i><b>--warning</b><em>#8f5c0e</em><em>Dossier incomplet</em></div>
<div class="s"><i style="background:var(--danger)"></i><b>--danger</b><em>#b3261e</em><em>Prérequis manquant</em></div>
<div class="s"><i style="background:var(--info)"></i><b>--info</b><em>#2f5f8f</em><em>Mention administrative</em></div>
</div>
<div class="pills">
<span class="p" style="background:var(--success-surface);color:var(--success)">Session confirmée</span>
<span class="p" style="background:var(--warning-surface);color:var(--warning)">Dossier incomplet</span>
<span class="p" style="background:var(--danger-surface);color:var(--danger)">Session reportée</span>
<span class="p" style="background:var(--info-surface);color:var(--info)">Dates à convenir</span>
</div></body></html>
