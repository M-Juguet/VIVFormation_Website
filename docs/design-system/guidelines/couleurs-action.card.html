<!-- @dsCard group="Colors" viewport="700x210" name="Action et accent" subtitle="Les seules couleurs de marque qui portent du texte" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Action et accent</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.sw{display:flex;gap:12px}.s{flex:1}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;font:var(--text-label);margin-top:8px}.s em{display:block;font:var(--text-caption);color:var(--ink-muted);font-style:normal}.demo{display:flex;gap:12px;align-items:center;margin-top:16px}.b{background:var(--action);color:var(--on-action);padding:12px 20px;border-radius:var(--radius-md);font:var(--text-button)}.b2{background:var(--action-hover);color:var(--on-action);padding:12px 20px;border-radius:var(--radius-md);font:var(--text-button)}.a{color:var(--action);font:var(--text-body)}</style>
</head><body>
<div class="sw">
<div class="s"><i style="background:var(--action)"></i><b>--action</b><em>#9c3f68</em><em>Lien, bouton primaire, onglet actif</em></div>
<div class="s"><i style="background:var(--action-hover)"></i><b>--action-hover</b><em>#7f3253</em><em>Survol et pressé</em></div>
<div class="s"><i style="background:var(--accent-deep)"></i><b>--accent-deep</b><em>#8f5c0e</em><em>Titre d'objectifs, chiffre clé</em></div>
<div class="s"><i style="background:var(--focus)"></i><b>--focus</b><em>#9c3f68</em><em>Anneau 2px, écart 2px</em></div>
</div>
<div class="demo"><span class="b">Demander des dates</span><span class="b2">survol</span><a class="a" href="#">Voir la fiche programme</a><span style="color:var(--accent-deep)" class="data">21 heures</span></div>
</body></html>
