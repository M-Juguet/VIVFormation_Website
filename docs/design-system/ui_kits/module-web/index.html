<!-- @dsCard group="Module web" viewport="880x620" name="Module de formation" subtitle="Leçon, quiz corrigé, fin de module : une seule figure de transition, 8px et un fondu" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIV Formation — module web</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/logos/viv-submark-noir.svg">
<style>html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}a{color:var(--action)}a:hover{color:var(--action-hover)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="module-data.js"></script>
<script type="text/babel" src="ModuleScreens.jsx"></script>
<script type="text/babel" data-presets="react">
const VIVDS = window.VivFormationDesignSystem_81f768;
function ModuleApp() {
  const ecrans = window.VIV_MODULE.ecrans;
  const [i, setI] = React.useState(0);
  const [back, setBack] = React.useState(false);
  const e = ecrans[i];
  const go = (n) => { setBack(n < i); setI(n); };
  return (
    <>
      <ModuleHeader index={i} total={ecrans.length} />
      <main className="viv-wrap" style={{ maxWidth: 880, paddingTop: 'var(--space-10)', paddingBottom: 'var(--space-12)' }}>
        <div key={i} className={back ? 'viv-enter viv-enter--back' : 'viv-enter'}>
          {e.type === 'lecon' && <LessonScreen data={e} />}
          {e.type === 'quiz' && <QuizScreen data={e} />}
          {e.type === 'fin' && <FinScreen data={e} />}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 'var(--space-4)', marginTop: 'var(--space-12)', paddingTop: 'var(--space-5)', borderTop: '1px solid var(--border)' }}>
          <VIVDS.Button variant="ghost" disabled={i === 0} onClick={() => go(i - 1)}>Écran précédent</VIVDS.Button>
          <VIVDS.Button disabled={i === ecrans.length - 1} onClick={() => go(i + 1)} icon={<VIVDS.Icon name="arrow-right" size={18} />}>
            {i === ecrans.length - 1 ? 'Module terminé' : 'Continuer'}
          </VIVDS.Button>
        </div>
        <p className="caption" style={{ color: 'var(--ink-muted)', marginTop: 'var(--space-6)' }}>
          C'est vous qui réglez le rythme : aucun écran n'avance seul, aucune vidéo ne démarre d'elle-même.
        </p>
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ModuleApp />);
</script>
</body></html>
