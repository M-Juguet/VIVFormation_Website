<!-- @dsCard group="Site" viewport="1120x900" name="Catalogue et fiche programme" subtitle="Site public : catalogue filtrable, fiche programme, demande de dates" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIV Formation — catalogue</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/logos/viv-submark-noir.svg">
<style>html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}a{color:var(--action)}a:hover{color:var(--action-hover)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="CatalogueScreen.jsx"></script>
<script type="text/babel" src="FicheScreen.jsx"></script>
<script type="text/babel" src="DemandeScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const [route, setRoute] = React.useState('catalogue');
  const [id, setId] = React.useState('blender-modelisation');
  const go = (r) => { window.scrollTo(0, 0); setRoute(r); };
  return (
    <>
      <SiteHeader route={route} onNavigate={go} />
      {route === 'catalogue' && <CatalogueScreen onOpen={(i) => { setId(i); go('fiche'); }} onDemande={() => go('demande')} />}
      {route === 'fiche' && <FicheScreen id={id} onBack={() => go('catalogue')} onDemande={() => go('demande')} />}
      {route === 'demande' && <DemandeScreen onBack={() => go('catalogue')} />}
      <SiteFooter />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
