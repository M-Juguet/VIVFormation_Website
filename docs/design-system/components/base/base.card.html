<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>VIV Formation — composants de base</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:var(--space-5)}#root{display:flex;flex-direction:column;gap:var(--space-5)}.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);align-items:start}.lbl{font:var(--text-overline);text-transform:uppercase;color:var(--ink-subtle);margin:0}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Badge, Card, Field, Callout, Icon, Logo, Figure } = window.VivFormationDesignSystem_81f768;
function Demo() {
  return (
    <>
      <div className="row">
        <Button>Demander des dates</Button>
        <Button variant="secondary">Télécharger le programme</Button>
        <Button variant="ghost" icon={<Icon name="arrow-right" size={18} />}>Voir la fiche</Button>
        <Button size="sm">Demander un devis</Button>
        <Button size="sm" pill variant="secondary">Blender</Button>
        <Button disabled>Devis en préparation</Button>
      </div>
      <div className="row">
        <Badge tone="rose">Blender</Badge>
        <Badge tone="peach">Unreal Engine</Badge>
        <Badge tone="gold">IA générative</Badge>
        <Badge tone="neutral">Présentiel</Badge>
        <Badge tone="success" icon={<Icon name="circle-check" size={16} />}>Session confirmée</Badge>
        <Badge tone="info">Dates à convenir</Badge>
        <Badge tone="warning">Dossier incomplet</Badge>
        <Badge tone="danger">Session reportée</Badge>
      </div>
      <div className="row">
        <Icon name="clock" size={20} /><Icon name="users" size={20} /><Icon name="monitor" size={20} /><Icon name="cpu" size={20} /><Icon name="target" size={20} /><Icon name="diploma" size={20} />
        <Icon name="outil-blender" size={24} tile="degrade" shape="carre" label="Blender" />
        <Icon name="sparkles" size={24} tile="gold" />
        <Icon name="download" size={24} tile="action" />
        <Icon name="play" size={24} tile="ink" />
        <Logo mark="complet" height={28} />
        <Logo tile="degrade" size={44} />
        <Logo tile="contour" size={44} />
      </div>
      <div className="grid">
        <Card overline="Modalités" title="Organisation de la session" footer={<Button size="sm" variant="secondary">Demander un devis</Button>}>
          <p>Présentiel dans vos locaux ou sur le site du client. Groupe de 3 à 6 participants.</p>
        </Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
          <Field label="Version de Blender installée" hint="Numéro et canal, p. ex. 5.2 LTS" defaultValue="5.2 LTS" required />
          <Field label="Nombre de participants" error="Indiquez un nombre entre 3 et 6." defaultValue="9" />
        </div>
      </div>
      <div className="grid">
        <Callout tone="warning" title="Machine à vérifier"><p style={{ margin: 0 }}>8 Go de VRAM au minimum sur chaque poste.</p></Callout>
        <Callout tone="success"><p style={{ margin: 0 }}>Les trois objectifs du module sont validés.</p></Callout>
      </div>
      <Figure placeholder="Capture d'un fichier d'exercice" caption="Cadrez sur le panneau dont parle le texte." credit="VIV Formation" />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
